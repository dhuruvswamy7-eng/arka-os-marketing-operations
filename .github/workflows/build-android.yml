name: Build ARKA OS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend
        run: |
          cd artifacts/arka-os
          npm install
          npm run build

      - name: Sync Capacitor Android Project
        run: |
          cd artifacts/arka-os
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd artifacts/arka-os/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ARKA-OS.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARKA-OS-Android-APK
          path: artifacts/arka-os/ARKA-OS.apk

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "ARKA OS Android Mobile App (.apk)"
          body: |
            ### 📱 ARKA OS Android Mobile App
            Direct download link for Android devices (Samsung, OnePlus, Vivo, Xiaomi, Oppo, Pixel, etc.).
            
            **Installation Instructions:**
            1. Click **`ARKA-OS.apk`** below to download directly to your Android phone.
            2. Open the downloaded file and tap **Install**.
          files: artifacts/arka-os/ARKA-OS.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
