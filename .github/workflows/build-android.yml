name: Build ARKA OS Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend
        run: |
          cd artifacts/arka-os
          npm install
          npm run build

      - name: Sync Capacitor Android Project
        run: |
          cd artifacts/arka-os
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd artifacts/arka-os/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ARKA-OS.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ARKA-OS-Android-APK
          path: artifacts/arka-os/ARKA-OS.apk
